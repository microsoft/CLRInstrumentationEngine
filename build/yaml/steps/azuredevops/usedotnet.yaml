# Step Template: Install .NET SDKs for managed builds and tests

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 10.0 SDK'
    inputs:
      packageType: 'sdk'
      version: '10.0.x'
      performMultiLevelLookup: true

  - task: UseDotNet@2
    displayName: 'Install .NET 11.0 SDK'
    inputs:
      packageType: 'sdk'
      version: '11.0.x'
      includePreviewVersions: true
      performMultiLevelLookup: true
