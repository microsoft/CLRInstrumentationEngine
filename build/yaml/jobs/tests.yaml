# Job Template: Test binaries
# Test binaries

parameters:
  Configuration: Both
  IsMicroBuildInternal: false

jobs:
# Test Windows Binaries
- template: windows/tests.yaml@self
  parameters:
    IsMicroBuildInternal: ${{ parameters.IsMicroBuildInternal }}
    TestType: 'Native'
    MatrixStrategy:
      ${{ if or( eq(parameters.Configuration, 'Both'), eq(parameters.Configuration, 'Debug') )}}:
        Debug_x86:
          Configuration: 'Debug'
          Platform: 'x86'
          RunSettingsFile: 'x86.runsettings'
        Debug_x64:
          Configuration: 'Debug'
          Platform: 'x64'
          RunSettingsFile: 'x64.runsettings'

- template: windows/tests.yaml@self
  parameters:
    IsMicroBuildInternal: ${{ parameters.IsMicroBuildInternal }}
    TestType: 'Managed'
    MatrixStrategy:
      ${{ if or( eq(parameters.Configuration, 'Both'), eq(parameters.Configuration, 'Debug') )}}:
        Debug_AnyCPU:
          Configuration: 'Debug'
          Platform: 'AnyCPU'
          RunSettingsFile: 'x64.runsettings'

# Test Linux Binaries
- template: linux/tests.yaml@self
  parameters:
    MatrixStrategy:
      NET_Next:
        TargetFrameworkFolder: net11.0
        NetSdkVersion: 11.0.x
      NET_LTS:
        TargetFrameworkFolder: net10.0
        NetSdkVersion: 10.0.x