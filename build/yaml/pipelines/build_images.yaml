# Build Pipeline: Linux Build Images
# Manually rebuilds and publishes the Ubuntu and Alpine images used by Linux CI.

trigger: none
pr: none

name: $(date:yyyyMMdd)$(rev:rr)

parameters:
- name: ImageTag
  displayName: Container image tag
  type: string
  default: latest
- name: RegistryArmServiceConnection
  displayName: ACR Azure Resource Manager service connection
  type: string
  default: 'VS Diagnostics Dev (ProdDiagBuild)'

variables:
- name: TeamName
  value: ClrInstrumentationEngine
  readonly: true
- name: ImageTag
  value: ${{ parameters.ImageTag }}
  readonly: true

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: AzurePipelines-EO
      image: 1ESPT-Ubuntu20.04
      os: linux

    sdl:
      sourceAnalysisPool:
        name: VSEngSS-MicroBuild2022-1ES
        os: windows

    stages:
    - stage: BuildImages
      displayName: Build Linux images

      jobs:
      - job: BuildUbuntuImage
        displayName: Build and publish Ubuntu image

        templateContext:
          authenticatedContainerRegistries:
          - armServiceConnection: ${{ parameters.RegistryArmServiceConnection }}
            acrName: proddiagbuild

          outputs:
          - output: containerImage
            image: proddiagbuild.azurecr.io/clrie-build-ubuntu:$(ImageTag)
            targetPath: $(Build.ArtifactStagingDirectory)
            artifactName: ubuntu-image

        steps:
        - checkout: self
          clean: true

        - task: 1ES.BuildContainerImage@1
          displayName: Build Ubuntu image
          inputs:
            image: proddiagbuild.azurecr.io/clrie-build-ubuntu:$(ImageTag)
            path: $(Build.SourcesDirectory)/src/unix/docker/context
            dockerfile: $(Build.SourcesDirectory)/src/unix/docker/dockerfiles/build/ubuntu/Dockerfile
            enableNetwork: true
            useBuildKit: true

      - job: BuildAlpineImage
        displayName: Build and publish Alpine image

        templateContext:
          authenticatedContainerRegistries:
          - armServiceConnection: ${{ parameters.RegistryArmServiceConnection }}
            acrName: proddiagbuild

          outputs:
          - output: containerImage
            image: proddiagbuild.azurecr.io/clrie-build-alpine:$(ImageTag)
            targetPath: $(Build.ArtifactStagingDirectory)
            artifactName: alpine-image

        steps:
        - checkout: self
          clean: true

        - task: 1ES.BuildContainerImage@1
          displayName: Build Alpine image
          inputs:
            image: proddiagbuild.azurecr.io/clrie-build-alpine:$(ImageTag)
            path: $(Build.SourcesDirectory)/src/unix/docker/context
            dockerfile: $(Build.SourcesDirectory)/src/unix/docker/dockerfiles/build/alpine/Dockerfile
            enableNetwork: true
            useBuildKit: true
